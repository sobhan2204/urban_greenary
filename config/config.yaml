project:
  name: "Himalayan Snow & Avalanche Susceptibility Mapping for Vegetation Restoration"
  seed: 42

paths:
  data:
    raw: "data/raw"
    processed: "data/processed"
    output: "data/output"
    output_final: "data/output/final"
  models:
    saved_models: "models/saved_models"
    vegetation_model: "models/saved_models/vegetation_model.pkl"
  logs:
    dir: "logs"

data_collection:
  provider: "gee" 
  bounding_boxes:
    - id: "rohtang_pass"
      min_lat: 32.30
      min_lon: 77.15
      max_lat: 32.40
      max_lon: 77.30
    - id: "solang_valley"
      min_lat: 32.25
      min_lon: 77.10
      max_lat: 32.35
      max_lon: 77.20
  tile_size:
    height: 256
    width: 256
  sentinel:
    num_channels: 5
    bands: ["B02", "B03", "B04", "B08", "B11"]
  dem:
    num_channels: 1
  gee:
    project_id: "urban-green-mapping"
    sentinel_collection: "COPERNICUS/S2_SR_HARMONIZED"
    sentinel_fallback:
      enabled: true
      collection: "COPERNICUS/S2_HARMONIZED"
    expand_months: 2
    sample_scale: 10
    sample_patch_sizes: [256, 128]
    reduce_scale: 30
    reduce_tile_scale: 4
    max_pixels: 100000000
    request_timeout_ms: 120000
    date_windows:
      - name: "primary"
        start_date: "2025-09-15"
        end_date: "2025-11-15"
      - name: "secondary"
        start_date: "2025-04-01"
        end_date: "2025-05-15"
    cloud_filters: [30, 50, 70]
    cloud_property: "CLOUDY_PIXEL_PERCENTAGE"
    scl_mask:
      enabled: true
      scl_band: "SCL"
      allow_snow: true
      keep_classes: [4, 5, 6, 7, 11]
      min_survival_ratio: 0.05
    ndsi:
      enabled: true
      green_band: "B03"
      swir_band: "B11"
      snow_threshold: 0.4
      snow_fraction_min: 0.01
    dem_sources:
      - source: "USGS/SRTMGL1_003"
        band: "elevation"
      - source: "COPERNICUS/DEM/GLO30"
        band: "DEM"
  local:
    manifest_path: "data/raw/tile_manifest.csv"
  synthetic:
    num_tiles_per_bbox: 2
    sentinel_value_range: [0, 10000]
    dem_value_range: [0, 6000]
    seed: 123

preprocessing:
  normalization:
    method: "minmax"
    per_channel: true
    epsilon: 1.0e-6
  ndvi:
    nir_band_index: 3
    red_band_index: 2
  ndwi:
    green_band_index: 1
    nir_band_index: 3
  ndsi:
    green_band_index: 1
    swir_band_index: 4
  patching:
    patch_size: 16
  resize:
    enabled: false
    height: 256
    width: 256

labeling:
  class_map:
    background: 0
    snow: 1
    vegetation: 2
    water: 3
    barren: 4
  ndvi_thresholds:
    vegetation_min: 0.2
    vegetation_max: 1.0
    water_max: 0.0
  ndsi_thresholds:
    snow_min: 0.4
  barren_thresholds:
    ndvi_max: 0.1
    ndsi_max: 0.2
  ignore_index: 255

model:
  multissl:
    embed_dim: 128
    depth: 4
    num_heads: 4
    mlp_ratio: 4
    drop_rate: 0.1
    mask_ratio: 0.35
    patch_size: 16
  ukan:
    decoder_channels: [128, 64, 32, 16]
    attention_heads: 4
    dropout: 0.1
    num_classes: 5
    kernel_size: 3
    upsample_scale: 2
    upsample_mode: "bilinear"
  loss:
    type: "cross_entropy"
    ignore_index: 255
  optimizer:
    type: "adamw"
    lr: 0.0003
    weight_decay: 0.01
  training:
    pretrain_epochs: 2
    finetune_epochs: 2
    batch_size: 2
    num_workers: 0
    device: "cpu"
    gradient_clip_norm: 1.0
    amp: false

inference:
  batch_size: 2
  device: "cpu"

scoring:
  vegetation:
    class_indices: [2]
    elevation_limit: 3500
    normalize: true
  avalanche:
    slope:
      min_deg: 25
      max_deg: 45
    aspect:
      favorable_ranges:
        - [315, 360]
        - [0, 45]
    curvature:
      min: -0.2
      max: 0.2
    elevation:
      min: 2000
      max: 5500
    weights:
      slope: 0.4
      aspect: 0.3
      curvature: 0.2
      elevation: 0.1
    normalize: true
    dem_spacing: 30.0
  final:
    safe_threshold: 0.7
    danger_threshold: 0.3

visualization:
  format: "png"
  dpi: 200
  vegetation_cmap: "Greens"
  avalanche_cmap: "Reds"
  combined_cmap: "RdYlGn"
  base_rgb:
    rgb_band_indices: [2, 1, 0]
  overlay_thresholds:
    vegetation_min: 0.6
    avalanche_safe_max: 0.3
    combined_min: 0.7
  overlay_colors:
    vegetation: [0.0, 0.8, 0.0]
    avalanche_safe: [1.0, 0.0, 0.0]
    combined: [1.0, 0.4, 0.0]
  overlay_alpha: 0.6
  make_folium: false
  folium_zoom: 10
  output_naming:
    vegetation: "vegetation_map_{tile_id}"
    avalanche: "avalanche_map_{tile_id}"
    combined: "combined_map_{tile_id}"

data_validation:
  sentinel_valid_fraction_min: 0.05
  dem_valid_fraction_min: 0.8
  min_band_std: 1.0e-4
  band_value_ranges:
    B02: [0, 10000]
    B03: [0, 10000]
    B04: [0, 10000]
    B08: [0, 10000]
    B11: [0, 10000]
  ndvi_range: [-1.0, 1.0]
  ndwi_range: [-1.0, 1.0]
  ndsi_range: [-1.0, 1.0]
  slope_range: [0.0, 90.0]
  elevation_range: [0.0, 9000.0]
